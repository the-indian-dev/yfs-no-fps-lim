# This starter workflow is for a CMake project running on multiple platforms.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "main-output-dir=${{ github.workspace }}/build/main" >> "$GITHUB_OUTPUT"

    - name: Install development libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libasound2-dev \
          libpulse-dev

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        echo "Configuring CMake for Linux with GCC/Clang specific flags"
        cmake \
          -S src \
          -B ${{ steps.strings.outputs.build-output-dir }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_FLAGS="-Wno-incompatible-pointer-types" \
          -DCMAKE_CXX_FLAGS="-Wno-incompatible-pointer-types" \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      working-directory: ${{ github.workspace }}
      shell: cmd # Using cmd for Windows
      run: |
        echo "Configuring CMake for Windows (MSVC)"
        cmake -S src ^
          -B ${{ steps.strings.outputs.build-output-dir }} ^
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} ^
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} ^
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ^
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          :: No -Wno-incompatible-pointer-types for MSVC by default.

    - name: Build
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}
        --parallel

    - name: Copy icon (Example - if not handled by CMake)
      # This step ensures the icon is in the expected location before zipping,
      # especially if your CMake doesn't place it in build/main/misc.
      # Your build.sh implies `build/main/misc/` is the target for the icon.
      if: success()
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        ICON_SOURCE_PATH="src/misc/icon.png"
        # Ensure the icon destination is within the directory we plan to zip.
        ICON_DEST_DIR="${{ steps.strings.outputs.main-output-dir }}/misc"

        if [ -f "$ICON_SOURCE_PATH" ]; then
          echo "Icon found at $ICON_SOURCE_PATH. Attempting to copy..."
          # Ensure destination directory exists (mkdir -p is idempotent)
          mkdir -p "$ICON_DEST_DIR"
          cp "$ICON_SOURCE_PATH" "$ICON_DEST_DIR/icon.png"
          echo "Icon copied to $ICON_DEST_DIR/icon.png"
        else
          echo "Warning: Icon not found at $ICON_SOURCE_PATH (expected at ${{ github.workspace }}/$ICON_SOURCE_PATH). Skipping copy."
        fi

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} -V

    - name: Upload 'main' directory artifact
      if: success() # Only run if build and tests (if any run before this) are successful
      uses: actions/upload-artifact@v4
      with:
        name: Main-Build-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}
        # Path to the directory to be zipped and uploaded.
        # This will create a zip file containing the 'main' directory and its contents.
        path: ${{ steps.strings.outputs.main-output-dir }}
        # Options: warn (default), error, ignore
        if-no-files-found: warn
        retention-days: 7
