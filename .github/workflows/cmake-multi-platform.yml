# This starter workflow is for a CMake project running on multiple platforms.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            name_suffix: MSVC
          - os: windows-latest
            c_compiler: gcc # MinGW target
            cpp_compiler: g++
            name_suffix: MinGW
          - os: ubuntu-22.04
            c_compiler: gcc
            cpp_compiler: g++
            name_suffix: GCC
          - os: ubuntu-22.04
            c_compiler: clang
            cpp_compiler: clang++
            name_suffix: Clang
        exclude:
          # Clang on Windows is not part of this matrix setup
          - os: windows-latest
            c_compiler: clang
          # MSVC (cl) on Linux is not applicable
          - os: ubuntu-22.04
            c_compiler: cl

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "main-output-dir=${{ github.workspace }}/build/main" >> "$GITHUB_OUTPUT"

    - name: Install development libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libasound2-dev \
          libpulse-dev \
          ninja-build # Added for -G Ninja

    - name: Setup MSYS2 for MinGW
      if: runner.os == 'Windows' && matrix.c_compiler == 'gcc'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64 # Use the MINGW64 environment
        update: true
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          mesa:p # Installs mingw-w64-x86_64-toolchain, -cmake, -ninja, -mesa (for opengl32, glu32)

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        echo "Configuring CMake for Linux with GCC/Clang specific flags using Ninja"
        cmake \
          -S src \
          -B ${{ steps.strings.outputs.build-output-dir }} \
          -G "Ninja" \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_FLAGS="-Wno-incompatible-pointer-types" \
          -DCMAKE_CXX_FLAGS="-Wno-incompatible-pointer-types" \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

    - name: Configure CMake (Windows MSVC)
      if: runner.os == 'Windows' && matrix.c_compiler == 'cl'
      working-directory: ${{ github.workspace }}
      shell: cmd # Using cmd for Windows MSVC
      run: |
        echo "Configuring CMake for Windows (MSVC)"
        echo "Explicitly linking with opengl32.lib and glu32.lib as CMakeLists.txt is not updated."
        set EXTRA_LINK_FLAGS=opengl32.lib glu32.lib
        cmake -S src ^
          -B ${{ steps.strings.outputs.build-output-dir }} ^
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} ^
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} ^
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ^
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
          -DCMAKE_EXE_LINKER_FLAGS="%EXTRA_LINK_FLAGS%" ^
          -DCMAKE_SHARED_LINKER_FLAGS="%EXTRA_LINK_FLAGS%"

    - name: Configure CMake (Windows MinGW)
      if: runner.os == 'Windows' && matrix.c_compiler == 'gcc'
      working-directory: ${{ github.workspace }}
      shell: msys2 {0} # Run in MSYS2 environment
      run: |
        echo "Configuring CMake for Windows (MinGW) using Ninja"
        echo "Explicitly linking with -lopengl32 -lglu32 as CMakeLists.txt is not updated."
        cmake \
          -S src \
          -B ${{ steps.strings.outputs.build-output-dir }} \
          -G "Ninja" \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_FLAGS="-Wno-incompatible-pointer-types" \
          -DCMAKE_CXX_FLAGS="-Wno-incompatible-pointer-types" \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_EXE_LINKER_FLAGS="-lopengl32 -lglu32" \
          -DCMAKE_SHARED_LINKER_FLAGS="-lopengl32 -lglu32"

    # --- Build Steps (Conditional) ---
    - name: Build (Windows MinGW)
      if: runner.os == 'Windows' && matrix.c_compiler == 'gcc'
      shell: msys2 {0}
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}
        --parallel

    - name: Build (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}
        --parallel

    - name: Build (Windows MSVC)
      if: runner.os == 'Windows' && matrix.c_compiler == 'cl'
      shell: powershell # Using PowerShell for MSVC, cmd would also work
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}
        --parallel

    - name: Copy icon
      if: success() # Runs if the active build step (based on matrix) succeeded
      shell: bash # Bash is generally available on Windows runners via Git Bash
      working-directory: ${{ github.workspace }}
      run: |
        ICON_SOURCE_PATH="src/misc/logo.png"
        ICON_DEST_DIR="${{ steps.strings.outputs.main-output-dir }}/misc"

        if [ -f "$ICON_SOURCE_PATH" ]; then
          echo "Icon found at $ICON_SOURCE_PATH. Attempting to copy..."
          mkdir -p "$ICON_DEST_DIR"
          cp "$ICON_SOURCE_PATH" "$ICON_DEST_DIR/logo.png"
          echo "Icon copied to $ICON_DEST_DIR/logo.png"
        else
          echo "Warning: Icon not found at $ICON_SOURCE_PATH (expected at ${{ github.workspace }}/$ICON_SOURCE_PATH). Skipping copy."
        fi
        
    - name: Upload 'main' directory artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Main-Build-${{ matrix.os }}-${{ matrix.name_suffix }}-${{ matrix.build_type }}
        path: ${{ steps.strings.outputs.main-output-dir }}
        if-no-files-found: warn
        retention-days: 7
