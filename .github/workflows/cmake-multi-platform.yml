# This starter workflow is for a CMake project running on multiple platforms.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release] # You can add Debug, RelWithDebInfo, etc.
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install OpenGL development libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev

    - name: Configure CMake
      shell: bash # Use bash for the conditional flag logic
      run: |
        EXTRA_C_FLAGS=""
        EXTRA_CXX_FLAGS=""

        # Apply -Wno-incompatible-pointer-types only for GCC and Clang
        if [[ "${{ matrix.c_compiler }}" == "gcc" || "${{ matrix.c_compiler }}" == "clang" ]]; then
          EXTRA_C_FLAGS="-Wno-incompatible-pointer-types"
          EXTRA_CXX_FLAGS="-Wno-incompatible-pointer-types" # Assuming you want this for C++ too with these compilers
        fi

        cmake \
          -S ${{ github.workspace }}/src \
          -B ${{ steps.strings.outputs.build-output-dir }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_FLAGS"${EXTRA_C_FLAGS:+=$EXTRA_C_FLAGS}" \
          -DCMAKE_CXX_FLAGS"${EXTRA_CXX_FLAGS:+=$EXTRA_CXX_FLAGS}" \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

    - name: Build
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}
        --parallel

    - name: Copy icon (Example)
      # This step replicates `cp misc/icon.png build/main/misc/` from your build.sh
      # Assumes icon is at `src/misc/icon.png` and build creates `main/misc` in build dir.
      # Consider handling this within CMakeLists.txt for better practice.
      if: success()
      shell: bash
      run: |
        ICON_SOURCE_PATH="${{ github.workspace }}/src/misc/icon.png" # Assuming icon is in src/misc
        ICON_DEST_DIR="${{ steps.strings.outputs.build-output-dir }}/main/misc"

        if [ -f "$ICON_SOURCE_PATH" ]; then
          echo "Icon found at $ICON_SOURCE_PATH. Attempting to copy..."
          mkdir -p "$ICON_DEST_DIR"
          cp "$ICON_SOURCE_PATH" "$ICON_DEST_DIR/icon.png"
          echo "Icon copied to $ICON_DEST_DIR/icon.png"
        else
          echo "Warning: Icon not found at $ICON_SOURCE_PATH. Skipping copy."
          # To fail if icon is critical:
          # exit 1
        fi

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} -V
