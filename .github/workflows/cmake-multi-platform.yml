# This starter workflow is for a CMake project running on multiple platforms.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release] # You can add Debug, RelWithDebInfo, etc.
        c_compiler: [gcc, clang, cl] # This axis generates combinations
        include: # These define the valid complete configurations
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude: # These remove invalid combinations generated by the c_compiler axis
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install development libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libasound2-dev \
          libpulse-dev

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      working-directory: ${{ github.workspace }} # Set working directory
      shell: bash
      run: |
        echo "Configuring CMake for Linux with GCC/Clang specific flags"
        cmake \
          -S src \
          -B ${{ steps.strings.outputs.build-output-dir }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_FLAGS="-Wno-incompatible-pointer-types" \
          -DCMAKE_CXX_FLAGS="-Wno-incompatible-pointer-types" \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      working-directory: ${{ github.workspace }} # Set working directory
      shell: bash # Using bash for consistency, CMake handles paths from bash well typically
      run: |
        echo "Configuring CMake for Windows (MSVC)"
        cmake \
          -S src \
          -B ${{ steps.strings.outputs.build-output-dir }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          # No -Wno-incompatible-pointer-types for MSVC

    - name: Build
      # Build your program with the given configuration.
      # --config is needed for multi-config generators (e.g., Visual Studio on Windows).
      # --parallel enables parallel builds for faster compilation.
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}
        --parallel

    - name: Copy icon (Example)
      # This step replicates `cp misc/icon.png build/main/misc/` from your build.sh
      # It assumes:
      # 1. The icon is at `src/misc/icon.png` relative to your project root.
      # 2. Your build process creates a `main/misc` subdirectory within the build output directory.
      # It's generally better to handle file installation using CMake's `install()` commands
      # or `file(COPY ...)` commands within your CMakeLists.txt.
      if: success()
      shell: bash
      working-directory: ${{ github.workspace }} # Set working directory for relative source path
      run: |
        ICON_SOURCE_PATH="src/misc/icon.png" # Relative to github.workspace
        # ICON_DEST_DIR is absolute, constructed from GITHUB_OUTPUT of 'strings' step
        ICON_DEST_DIR="${{ steps.strings.outputs.build-output-dir }}/main/misc"

        if [ -f "$ICON_SOURCE_PATH" ]; then
          echo "Icon found at $ICON_SOURCE_PATH. Attempting to copy..."
          # Ensure destination directory exists (mkdir -p is idempotent)
          mkdir -p "$ICON_DEST_DIR"
          cp "$ICON_SOURCE_PATH" "$ICON_DEST_DIR/icon.png"
          echo "Icon copied to $ICON_DEST_DIR/icon.png"
        else
          echo "Warning: Icon not found at $ICON_SOURCE_PATH (expected at ${{ github.workspace }}/$ICON_SOURCE_PATH). Skipping copy."
          # To fail if icon is critical:
          # exit 1
        fi

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration.
      # --build-config (or CTEST_CONFIGURATION_TYPE) is needed for multi-config generators.
      run: ctest --build-config ${{ matrix.build_type }} -V # -V for verbose output
